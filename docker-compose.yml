version: "3.9"

services:
  # Ollama server
  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./ai-models/ollama:/root/.ollama

  ocr-service:
    build:
      context: .
      dockerfile: ai-services/Dockerfile
    command: ["uvicorn", "ocr_service:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./ai-models/easyocr:/app/ai-models/easyocr
    depends_on:
      - ollama  # not strictly needed, but ok

  parsing-service:
    build:
      context: .
      dockerfile: ai-services/Dockerfile
    command: ["uvicorn", "parsing_service:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  summarization-service:
    build:
      context: .
      dockerfile: ai-services/Dockerfile
    command: ["uvicorn", "summarization_service:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - ocr-service
      - parsing-service
      - summarization-service
