apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
      name: http

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models-pvc
  labels:
    app: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi # Adjusted size for multiple large LLMs

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  # Strategy is Recreate to ensure the Volume is detached from the old pod 
  # before the new one starts (crucial for ReadWriteOnce volumes)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          
          # Health checks to ensure the API is up
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 5
            
          # resources:
          #   requests:
          #     memory: "4Gi"
          #     cpu: "2000m"
          #   limits:
          #     memory: "8Gi"
          #     cpu: "4000m"
              # If you have Nvidia GPUs on your nodes, uncomment the line below:
              # nvidia.com/gpu: "1" 

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-models-pvc